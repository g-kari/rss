<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS Reader — シンプルで速い RSS リーダー</title>
    <meta name="description" content="AI 要約・翻訳、4 種レイアウト、ダーク/ライトテーマ対応のシンプルな RSS リーダー。" />

    <!-- OGP -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rss.0g0.xyz" />
    <meta property="og:title" content="RSS Reader" />
    <meta property="og:description" content="AI 要約・翻訳、4 種レイアウト、ダーク/ライトテーマ対応のシンプルな RSS リーダー。" />
    <meta property="og:image" content="https://rss.0g0.xyz/og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="RSS Reader" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RSS Reader" />
    <meta name="twitter:description" content="AI 要約・翻訳、4 種レイアウト、ダーク/ライトテーマ対応のシンプルな RSS リーダー。" />
    <meta name="twitter:image" content="https://rss.0g0.xyz/og.svg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RSS" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <!-- フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Reddit+Sans:ital,wght@0,300..700;1,300..700&family=IBM+Plex+Sans+JP:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
