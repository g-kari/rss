# https://pre-commit.ci/
ci:
  skip: [check-fix, typecheck, e2e-test, unit-test] # CI 環境に vp / node_modules / ブラウザがないためスキップ
  autofix_prs: true
  autoupdate_schedule: monthly

repos:
  - repo: local
    hooks:
      - id: check-fix
        name: oxlint + oxfmt (auto-fix)
        entry: npm run check:fix
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: typecheck
        name: tsc --noEmit
        entry: npm run typecheck
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: unit-test
        name: vitest unit (#682 Phase C)
        entry: npm run test:unit
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: e2e-test
        name: playwright e2e
        entry: npm run test:e2e
        language: system
        pass_filenames: false
        stages: [pre-commit]
