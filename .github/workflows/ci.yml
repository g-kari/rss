name: CI

on:
  push:
    branches: [master, codex/redesign-reading-workspace]
  pull_request:
    branches: [master]

# GITHUB_TOKEN 権限を最小化（CodeQL actions/missing-workflow-permissions 対応）。
# lint・型チェックはリポジトリ内容の読み取りのみで完結する。
permissions:
  contents: read

jobs:
  check:
    name: lint・fmt・型チェック
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v6

      - name: pnpm セットアップ
        uses: pnpm/action-setup@v6.0.8

      - name: Node.js セットアップ
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 依存パッケージインストール
        run: pnpm install --frozen-lockfile

      - name: check（lint + fmt + typecheck）
        run: pnpm run check

      - name: 型チェック（tsc）
        run: pnpm run typecheck

      - name: ユニットテスト（全体・並列数を制限）
        run: pnpm run test:unit --maxWorkers=2

      - name: 同一ニュース判定のオフライン評価契約（通信・課金なし）
        run: node --test scripts/evaluations/jev-news-grouping/*.test.mjs

      - name: production ビルド
        run: pnpm run build

      - name: 同一ビルドの公開フォント資産を描画テストへ渡す
        uses: actions/upload-artifact@v7
        with:
          name: reading-workspace-fonts-${{ github.sha }}
          path: |
            .next/static/chunks/*.css
            .next/static/media/*.woff2
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  scoped-recommendation-ui:
    name: おすすめ・モード UI (Chromium fixture)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: チェックアウト
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: pnpm セットアップ
        uses: pnpm/action-setup@v6.0.8

      - name: Node.js セットアップ
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 依存パッケージインストール
        run: pnpm install --frozen-lockfile

      - name: 公式 Chromium と実行依存をインストール
        run: pnpm exec playwright install --with-deps chromium

      - name: 同一ビルドの公開フォント資産を読み込む
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reading-workspace-fonts-${{ github.sha }}
          path: .ci/reading-workspace-fonts

      - name: 比較対象の immutable UI tree を取得
        run: |
          git fetch --no-tags --depth=1 origin 66d75a22a8a6b44542cbdbaaabc0b27b19053b7e
          git fetch --no-tags --depth=1 origin 0ec554009806d9d7ad263a7f1ac41240b59b1148

      - name: スコープ・再生・本文・キューのユニットテスト
        run: >-
          pnpm run test:unit --maxWorkers=2
          src/hooks/useFilteredArticles.recommendations.test.ts
          src/components/ArticleRecommendations.test.tsx
          src/components/ArticleList.recommendations.test.tsx
          src/components/ArticleList.motion.test.tsx
          src/components/ImmersiveArticleMode.test.tsx
          src/components/ImmersiveArticleMode.autoplay.test.tsx
          src/components/ImmersiveArticleMode.video.test.tsx
          src/components/CinematicVideo.test.tsx
          src/components/CinematicArticle.test.tsx
          src/hooks/useImmersiveClock.test.tsx
          src/hooks/useImmersiveNarration.test.tsx
          src/components/article-view/AutoReadController.immersive.test.tsx
          src/hooks/useFullContentIntent.test.tsx
          src/hooks/useFullContentIntent.concurrency.test.tsx
          src/components/ImmersiveInlineReader.test.tsx
          src/components/article-items/ArticleThumbnail.fallback.test.tsx
          src/lib/immersive-articles.test.ts
          src/lib/immersive-media.test.ts
          src/lib/immersive-text.test.ts
          src/lib/image-extractor.responsive.test.ts
          src/lib/immersive-quality-request-guard.test.ts
          src/lib/immersive-inline-content.test.ts
          src/lib/image-extractor.malformed.test.ts
          src/hooks/useReaderArrival.test.tsx
          src/hooks/useDelayedGalleryItems.test.ts
          src/lib/reader-motion-request-guard.test.ts
          src/contexts/VisualModeContext.test.tsx
          src/components/FeedRetryStatus.test.tsx
          src/cron/fetch.test.ts

      - name: 全画面の同条件比較を先に描画
        env:
          RSS_UI_BASELINE_SHA: ${{ github.event.pull_request.base.sha || (github.ref_name == 'codex/redesign-reading-workspace' && '0ec554009806d9d7ad263a7f1ac41240b59b1148') || '' }}
          RSS_UI_FONT_ASSET_ROOT: .ci/reading-workspace-fonts
          RSS_UI_ALTERNATIVE_SHA: 66d75a22a8a6b44542cbdbaaabc0b27b19053b7e
          PLAYWRIGHT_HTML_OUTPUT_DIR: .ci/reading-workspace-report
        run: >-
          pnpm run test:e2e:scoped
          --grep 'full workspace|complete workspace controls|stress sidebar'
          --output=.ci/reading-workspace-results

      - name: 合成全画面の比較を先に保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reading-workspace-comparison-${{ github.sha }}
          path: |
            .ci/reading-workspace-report/
            .ci/reading-workspace-results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: 既存のレスポンシブ production component fixture を確認
        run: >-
          pnpm run test:e2e:scoped
          --grep-invert 'full workspace|complete workspace controls|stress sidebar'

      - name: 合成データのレポートとスクリーンショットを保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: scoped-recommendation-ui-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
