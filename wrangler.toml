name = "rss-reader"
main = "./worker.ts"
# Preserve operator-managed variables (including maintenance pause) across deployments.
# Explicit config/CLI values still override retained values; verify each effective deployment.
keep_vars = true
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

routes = [{ pattern = "rss.0g0.xyz", custom_domain = true }]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "rss-reader"

[[services]]
binding = "FINDME_RSS"
service = "findme-rss"

[images]
binding = "IMAGES"

[vars]
# Approved conservative app reservations; these are not a Cloudflare billing hard cap.
# Full-context reservation is $0.026215/call: $1/month permits at most 38 reservations.
RSS_SUMMARY_PRECOMPUTE_ENABLED = "true"
RSS_SUMMARY_PRECOMPUTE_MODEL = "@cf/google/gemma-4-26b-a4b-it"
RSS_SUMMARY_PRECOMPUTE_RUN_USD = "0.131075"
RSS_SUMMARY_PRECOMPUTE_DAY_USD = "1"
RSS_SUMMARY_PRECOMPUTE_MONTH_USD = "1"
RSS_SUMMARY_PRECOMPUTE_MAX_ARTICLES = "5"
RSS_SUMMARY_PRECOMPUTE_MAX_DAILY_ARTICLES = "100"
RSS_SUMMARY_PRECOMPUTE_CONCURRENCY = "1"
# RSS_FEED_WRITES_PAUSED is intentionally NOT defaulted here. Unset/"false" = running;
# "true" = paused; malformed configured values fail closed. Never add a hardcoded false
# during a paused rollout. See docs/migrations/feed-writer-maintenance.md.
# RSS_ARTICLE_STORAGE_V2 and RSS_ARTICLE_SEARCH_INDEX are opt-in rollout gates.
# Leave unset until backups, writer drain, D1 schema and feed indexes are verified.
# Unset/false/invalid keeps legacy storage and search; an existing v2 head is never downgraded.
AUTH_BASE_URL = "https://id.0g0.xyz"
APP_BASE_URL = "https://rss.0g0.xyz"
# ベータアクセス制限: 許可する sub をカンマ区切りで列挙。空文字・未設定 = 制限なし（全員許可）
# pairwise sub を public repo に晒さないため、本番値は wrangler secret で管理する：
#   `npx wrangler secret put BETA_ALLOWED_SUBS`
# vars と secret は同名で共存できないため、wrangler.toml には宣言しない。
VAPID_SUBJECT = "mailto:admin@0g0.xyz"
# MCP/OAuth gates. Both are inert (fail closed) until the dedicated OAUTH_KV binding below
# is provisioned and uncommented. RSS_MCP_SUBSCRIBE_ENABLED additionally needs RSS_MCP_ENABLED.
RSS_MCP_ENABLED = "true"
RSS_MCP_SUBSCRIBE_ENABLED = "true"
# Cloudflare AI toMarkdown API (全文取得フォールバック用)
# CLOUDFLARE_API_TOKEN は `npx wrangler secret put CLOUDFLARE_API_TOKEN` で設定

[[r2_buckets]]
binding = "RSS_DATA"
bucket_name = "rss-reader-data"

# #1378: derived article search index. Enable only after creating a database and
# applying migrations/article-search (see docs/article-search-index.md). The real database
# ID must be supplied at rollout; do not use the local test configuration ID.
# [[d1_databases]]
# binding = "ARTICLE_SEARCH"
# database_name = "rss-reader-search"
# database_id = "<provisioned-database-id>"
# migrations_dir = "migrations/article-search"
# Binding alone does not activate D1 reads/writes: RSS_ARTICLE_SEARCH_INDEX=true is required.

# MCP/OAuth needs RSS_MCP_ENABLED="true" (set in [vars]) AND a dedicated OAUTH_KV
# binding; without the binding MCP stays disabled. Never share RATE_LIMIT
# storage or enable this while only merging code. See docs/mcp.md.
# [[kv_namespaces]]
# binding = "OAUTH_KV"
# id = "<approved-dedicated-oauth-namespace-id>"

# レートリミット用 KV namespace
# ⚠️ デプロイ前に以下を実行して id を取得・設定すること:
#   npx wrangler kv namespace create RATE_LIMIT
# 出力例: { id: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "5119630203bf4cd584a98877ec2aa0e4"

[ai]
binding = "AI"

# Browser Rendering バインディング (#768)
# booth.pm 等の Cloudflare bot 検出で Workers IP fetch が 403 になるサイトの
# OGP 取得 fallback 用。env.BROWSER.fetch() で REST API を Token 管理不要 + sub-request 課金なしで叩ける。
# https://developers.cloudflare.com/browser-rendering/get-started/sending-rest-api-requests-with-workers-binding/
[browser]
binding = "BROWSER"

[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# シークレットは以下で設定:
# npx wrangler secret put CLIENT_ID
# npx wrangler secret put CLIENT_SECRET
#
# Push 通知用 VAPID 鍵 (node scripts/generate-vapid-keys.mjs で生成):
# npx wrangler secret put VAPID_PUBLIC_KEY
# npx wrangler secret put VAPID_PRIVATE_KEY
#
# Brave Search API (レコメンドエンジン用、オプション):
# npx wrangler secret put BRAVE_SEARCH_API_KEY
#
# セルフホスト RSSHub 連携 (オプション):
# npx wrangler secret put RSSHUB_INSTANCE_URL    # 例: https://rsshub.example.com
# npx wrangler secret put RSSHUB_ACCESS_KEY      # RSSHub のアクセスキー (未設定時はなし)
#
# Workers 間通信の User-Agent (オプション、Cloudflare Bot Fight Mode 回避用):
# wrangler.toml の [vars] に追記: INTERNAL_SERVICE_USER_AGENT = "my-app/1.0"
#
# ※ INTERNAL_SERVICE_SECRET_RSS は廃止。Basic 認証 (CLIENT_ID/CLIENT_SECRET) のみ使用。
# 0g0-id の services テーブルに CLIENT_ID を登録しておくこと。
