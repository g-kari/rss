name = "rss-reader"
main = "./worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

routes = [
  { pattern = "rss.0g0.xyz", custom_domain = true }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "rss-reader"

[[services]]
binding = "FINDME_RSS"
service = "findme-rss"

[images]
binding = "IMAGES"

[vars]
AUTH_BASE_URL = "https://id.0g0.xyz"
APP_BASE_URL = "https://rss.0g0.xyz"
# ベータアクセス制限: 許可する sub をカンマ区切りで列挙。空文字なら制限なし
BETA_ALLOWED_SUBS = "551a6605-2ca0-4196-b823-5676dbd585a3"
# Cloudflare AI toMarkdown API (全文取得フォールバック用)
# CLOUDFLARE_API_TOKEN は `npx wrangler secret put CLOUDFLARE_API_TOKEN` で設定
CLOUDFLARE_ACCOUNT_ID = ""

[[r2_buckets]]
binding = "RSS_DATA"
bucket_name = "rss-reader-data"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "rss-reader-cache"

[ai]
binding = "AI"

[build]
command = "npm run build:cf"

[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# シークレットは以下で設定:
# npx wrangler secret put CLIENT_ID
# npx wrangler secret put CLIENT_SECRET
